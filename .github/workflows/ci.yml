name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A dependency override can satisfy an advisory and silently break an unrelated
      # consumer that needed the old major. This caught glob: a bare override collapsed
      # every glob to v13, breaking test-exclude@6 which needs glob 7's callable export
      # — and it only surfaced on a clean install, because a stale node_modules kept
      # the old copy around.
      - name: Overrides are scoped to a dependency path
        run: |
          if node -e "
            const o = require('./package.json').pnpm?.overrides ?? {};
            const bare = Object.keys(o).filter((k) => !k.includes('>'));
            if (bare.length) {
              console.error('Unscoped pnpm overrides: ' + bare.join(', '));
              console.error('Use \"parent>child\" so the pin cannot leak into an unrelated');
              console.error('consumer. See docs/02-specs/nfr/security-and-privacy.md.');
              process.exit(1);
            }
          "; then echo "all overrides are scoped"; fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  # Day boundaries must resolve in the tenant timezone, never the server's. Running the
  # suite under three timezones catches code that reads the ambient clock — the defect
  # the prototype shipped (prototype-parity F-01).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Jakarta, America/New_York]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The in-memory MongoDB binary is large; cache it rather than downloading per job.
      - name: Cache MongoDB binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Integration and tenancy tests under ${{ matrix.tz }}
        run: pnpm test:integration && pnpm test:tenancy
        env:
          TZ: ${{ matrix.tz }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # Global 80%, domain 95%, tenancy 100% branch. The ratchet only moves up — a
      # change that lowers a threshold fails here rather than being edited to pass.
      - name: Coverage ratchet
        run: pnpm test:coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
