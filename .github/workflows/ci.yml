name: ci

# Every pull request, and every deploy (P18.7-T4, ADR-0154): deploy.yml calls this workflow before it
# builds anything, so a push to development or main is checked once, by the run that ships it. A
# `push` trigger here as well would run the same suite twice for every merge.
on:
  pull_request:
  workflow_call:
    secrets:
      # Reads the superproject's docs and prototype (.github/ci/superproject-beside.sh). Passed by name, not
      # with `secrets: inherit`, so a call hands this workflow nothing else.
      SUPERPROJECT_DEPLOY_KEY:
        required: true

# Read the repository and nothing more; no job here writes anything through the token. Every action is
# pinned by commit, with its version beside it; .github/dependabot.yml proposes updates.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The parity specs read the superproject's docs/ and prototype/ at ../, where a laptop has them.
      - name: The superproject's docs and prototype, beside this checkout
        env:
          SUPERPROJECT_DEPLOY_KEY: ${{ secrets.SUPERPROJECT_DEPLOY_KEY }}
          SUPERPROJECT_REPOSITORY: ${{ vars.SUPERPROJECT_REPOSITORY || format('{0}/agency-boost', github.repository_owner) }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: bash .github/ci/superproject-beside.sh
      # No version pinned here on purpose: the action reads package.json#packageManager,
      # which is the same pnpm the lockfile was generated with and the same one Vercel
      # uses. Pinning it in four places is how CI came to run a pnpm that read the
      # overrides from somewhere the lockfile did not.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A dependency override can satisfy an advisory and silently break an unrelated
      # consumer that needed the old major. This caught glob: a bare override collapsed
      # every glob to v13, breaking test-exclude@6 which needs glob 7's callable export
      # — and it only surfaced on a clean install, because a stale node_modules kept
      # the old copy around.
      - name: Overrides are scoped to a dependency path
        run: |
          if node -e "
            const o = require('./package.json').pnpm?.overrides ?? {};
            const bare = Object.keys(o).filter((k) => !k.includes('>'));
            if (bare.length) {
              console.error('Unscoped pnpm overrides: ' + bare.join(', '));
              console.error('Use \"parent>child\" so the pin cannot leak into an unrelated');
              console.error('consumer. See docs/02-specs/nfr/security-and-privacy.md.');
              process.exit(1);
            }
          "; then echo "all overrides are scoped"; fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # docs/03-engineering/ci-cd.md has listed this step since it was written, and
      # docs/02-specs/api/conventions.md states it as settled fact — "CI fails if the
      # committed spec differs from what the code produces, so the contract can never
      # drift". Neither was true until 2026-09-06: the document was regenerated by hand,
      # by whoever remembered.
      #
      # It needs no database. The generator runs in Nest's preview mode, so nothing is
      # instantiated and Mongoose never dials — which is why this is two lines and not a
      # job carrying the mongod binary cache the integration jobs need.
      - name: OpenAPI document matches the code
        run: |
          pnpm openapi
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is stale. Run 'pnpm openapi' and commit the result."
            exit 1
          fi

  # Day boundaries must resolve in the tenant timezone, never the server's. Running the
  # suite under three timezones catches code that reads the ambient clock — the defect
  # the prototype shipped (prototype-parity F-01).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Jakarta, America/New_York]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The parity specs read the superproject's docs/ and prototype/ at ../, where a laptop has them.
      - name: The superproject's docs and prototype, beside this checkout
        env:
          SUPERPROJECT_DEPLOY_KEY: ${{ secrets.SUPERPROJECT_DEPLOY_KEY }}
          SUPERPROJECT_REPOSITORY: ${{ vars.SUPERPROJECT_REPOSITORY || format('{0}/agency-boost', github.repository_owner) }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: bash .github/ci/superproject-beside.sh
      # No version pinned here on purpose: the action reads package.json#packageManager,
      # which is the same pnpm the lockfile was generated with and the same one Vercel
      # uses. Pinning it in four places is how CI came to run a pnpm that read the
      # overrides from somewhere the lockfile did not.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The in-memory MongoDB binary is large; cache it rather than downloading per job.
      - name: Cache MongoDB binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Integration and tenancy tests under ${{ matrix.tz }}
        run: pnpm test:integration && pnpm test:tenancy
        env:
          TZ: ${{ matrix.tz }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The parity specs read the superproject's docs/ and prototype/ at ../, where a laptop has them.
      - name: The superproject's docs and prototype, beside this checkout
        env:
          SUPERPROJECT_DEPLOY_KEY: ${{ secrets.SUPERPROJECT_DEPLOY_KEY }}
          SUPERPROJECT_REPOSITORY: ${{ vars.SUPERPROJECT_REPOSITORY || format('{0}/agency-boost', github.repository_owner) }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: bash .github/ci/superproject-beside.sh
      # No version pinned here on purpose: the action reads package.json#packageManager,
      # which is the same pnpm the lockfile was generated with and the same one Vercel
      # uses. Pinning it in four places is how CI came to run a pnpm that read the
      # overrides from somewhere the lockfile did not.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # Global 80%, domain 95%, tenancy 100% branch. The ratchet only moves up — a
      # change that lowers a threshold fails here rather than being edited to pass.
      #
      # Two workers, not jest.config.ts's four: the runner has two vCPUs, so a third and a fourth add
      # no throughput, only memory, and a queue for the CPU that pushed hooks past their 30 s here.
      - name: Coverage ratchet
        run: pnpm test:coverage --maxWorkers=2

  # The read budgets (docs/02-specs/nfr/performance-and-scale.md), one suite at a time with nothing beside
  # it. They are left out of every other run: a p95 taken beside three other workers, or under coverage,
  # measured those and not the read (jest.config.ts). None of them reads the superproject.
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No version pinned here on purpose: the action reads package.json#packageManager,
      # which is the same pnpm the lockfile was generated with and the same one Vercel
      # uses. Pinning it in four places is how CI came to run a pnpm that read the
      # overrides from somewhere the lockfile did not.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - name: Read budgets, one suite at a time
        run: pnpm test:performance

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No version pinned here on purpose: the action reads package.json#packageManager,
      # which is the same pnpm the lockfile was generated with and the same one Vercel
      # uses. Pinning it in four places is how CI came to run a pnpm that read the
      # overrides from somewhere the lockfile did not.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high

  # The image the VMs run, built as deploy.yml builds it and started as a VM starts it (P18.7-T3,
  # ADR-0152). deploy/ci/container-smoke.sh gives it a mongo:7.0 on a private network and asserts that
  # readiness answers 200, then 503 once the database is stopped, then 200 again: what bin/deploy.sh
  # relies on to roll back an image that cannot reach its database. It runs the same on a laptop.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Decoys where the real things would be: google-github-actions/auth writes gha-creds-*.json into the
      # workspace, and a laptop has a .env. The last step proves .dockerignore kept both out of the image.
      - name: Plant decoy credentials in the build context
        run: |
          echo '{"decoy": "a credentials file that must never reach an image"}' > gha-creds-ci-decoy.json
          echo 'DECOY=a local env file that must never reach an image' > .env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: agencyboost-api:ci
          # The scope staging's deploy build reads. Production's build imports no cache at all.
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,scope=api-runtime,mode=max
      - name: Build the tools image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tools
          load: true
          tags: agencyboost-tools:ci
          cache-from: |
            type=gha,scope=api-tools
            type=gha,scope=api-runtime
          cache-to: type=gha,scope=api-tools,mode=max
      - name: Readiness answers 200 beside a database and 503 without one
        run: bash deploy/ci/container-smoke.sh agencyboost-api:ci
      - name: Neither image carries a credentials file or an env file
        run: bash deploy/ci/no-secrets-in-image.sh agencyboost-api:ci agencyboost-tools:ci

  # The VM's scripts and compose file (P18.7-T3). None of them runs anywhere before it reaches a VM,
  # so a typo here is otherwise found by a failed deploy. CI's own scripts, in .github/ci, are checked too.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Shell syntax
        run: find deploy .github/ci -name '*.sh' -print0 | xargs -0 -n1 bash -n
      # Pinned rather than the runner's own copy, whose version moves with the runner image.
      - name: shellcheck
        run: find deploy .github/ci -name '*.sh' -print0 | sort -z | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
      - name: compose.yml resolves, publishes only Caddy, and never creates the data directory
        run: bash deploy/ci/compose-config.sh
